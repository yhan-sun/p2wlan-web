<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">P2WLAN</title>
  <desc id="desc">四个网络节点连接到中心节点的 P2P 图标</desc>
  <defs>
    <linearGradient id="icon-bg" x1="8" y1="6" x2="57" y2="59" gradientUnits="userSpaceOnUse">
      <stop stop-color="#17234a"/><stop offset=".52" stop-color="#24194f"/><stop offset="1" stop-color="#0b122a"/>
    </linearGradient>
    <linearGradient id="icon-line" x1="16" y1="16" x2="49" y2="48" gradientUnits="userSpaceOnUse">
