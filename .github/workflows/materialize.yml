name: Materialize optimized website source

on:
  push:
    branches:
      - feat/full-site-optimization-20260828
    paths:
      - ".github/workflows/materialize.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-p2wlan-web
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore source archive
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          path = Path('.site-chunks/part-08')
          target = '96e93cf3a57f22e5156a72e9215958bff6618b8e7cce287a478c91e8be130eb2'
          data = path.read_bytes()

          if sha256(data).hexdigest() != target:
              repaired = None
              for offset in range(len(data) - 11):
                  candidate = data[:offset] + data[offset + 12:]
                  if sha256(candidate).hexdigest() == target:
                      repaired = candidate
                      print(f'Removed the 12-byte transfer insertion at offset {offset}.')
                      break
              if repaired is None:
                  raise SystemExit('Unable to repair part-08 to its expected digest.')
              path.write_bytes(repaired)
          PY

          wc -c .site-chunks/part-*
          cat <<'CHECKSUMS' | sha256sum --check
          d4ef842109b639d611dee361489a15860f8397624f8469719a75ec2c0be0fd2d  .site-chunks/part-00
          e656d6b4a2c81574d41bd6ea4b80a105a33c2ff3a774d2ac4b8024a057311c03  .site-chunks/part-01
          6a0fa395fa7ede6d77b5b7a9ab7e456e703d67e17582e4e31efade01578134c4  .site-chunks/part-02
          9e70b01ef489cceffda88ba6099f73a8c79bc193b193692a17ba962cdb5bcaa4  .site-chunks/part-03
          a093e27940d1245e9b957eb7bc8557ac85d4cd3684c7f0fb1d99d0a857ec9676  .site-chunks/part-04
          1777f64d9d1f1ab6d03d70196123f62f442c3e49a925b189136c0540b802825a  .site-chunks/part-05
          12648820a09048d7c9976a5271b40a8ab885b6f5280a7f655bd40cb9f07f4502  .site-chunks/part-06
          fc2479eb9eb26028257b04a6a6855bfd33f59259762c655080b77fdea88b0fe6  .site-chunks/part-07
          96e93cf3a57f22e5156a72e9215958bff6618b8e7cce287a478c91e8be130eb2  .site-chunks/part-08
          CHECKSUMS
          cat .site-chunks/part-* > /tmp/p2wlan-web-source.tar.gz.b64
          base64 --decode /tmp/p2wlan-web-source.tar.gz.b64 > /tmp/p2wlan-web-source.tar.gz
          echo "dc788563ca1a7635fdf8aeabaf6d95a9b872a76ac26f8d1afe8ba3ac26be6d6b  /tmp/p2wlan-web-source.tar.gz" | sha256sum --check
          rm -rf src scripts public package.json package-lock.json README.md .gitignore \
            index.html vite.config.ts tsconfig.json tsconfig.app.json tsconfig.node.json .oxlintrc.json
          tar -xzf /tmp/p2wlan-web-source.tar.gz -C .
          git checkout -- .github/workflows/deploy.yml .github/workflows/materialize.yml
          rm -rf .site-chunks
      - name: Validate materialized source
        run: |
          npm ci --ignore-scripts
          npm run check
      - name: Commit materialized source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --exit-code -- .github/workflows || {
            echo "Workflow files must be updated through the GitHub connector." >&2
            exit 1
          }
          git commit -m "feat: rebuild P2WLAN website and documentation"
          git push origin HEAD
