name: Validate website

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "public/**"
      - "scripts/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-quality-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Sync latest P2WLAN release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_SYNC_REQUIRED: "true"
        run: npm run sync-release

      - name: Validate content and generated site
        run: npm run check
