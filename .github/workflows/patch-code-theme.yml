name: Apply theme-aware code block styling

on:
  push:
    branches:
      - fix/light-theme-code-blocks-20260828
    paths:
      - ".github/workflows/patch-code-theme.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Replace dark-only code block styling
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("src/styles.css")
          css = path.read_text()

          def replace_once(old: str, new: str, label: str) -> None:
              global css
              if css.count(old) != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {css.count(old)}")
              css = css.replace(old, new, 1)

          replace_once(
              """    --surface-dark: #151719;
              --surface-dark-soft: #1d2023;
              --surface-dark-border: #303439;
              --shadow-soft: 0 14px 38px rgb(18 22 27 / 6%);""",
              """    --surface-dark: #151719;
              --surface-dark-soft: #1d2023;
              --surface-dark-border: #303439;
              --code-bg: #eeeeea;
              --code-bg-raised: #e6e7e2;
              --code-border: #cfd1cb;
              --code-text: #292e32;
              --code-muted: #71777c;
              --code-button-bg: #f7f7f4;
              --code-button-hover: #ffffff;
              --code-selection: #dbe3f6;
              --shadow-soft: 0 14px 38px rgb(18 22 27 / 6%);""",
              "light code tokens",
          )

          replace_once(
              """    --surface-dark: #0d0f10;
              --surface-dark-soft: #151719;
              --surface-dark-border: #303438;
              --shadow-soft: 0 18px 44px rgb(0 0 0 / 16%);""",
              """    --surface-dark: #0d0f10;
              --surface-dark-soft: #151719;
              --surface-dark-border: #303438;
              --code-bg: #0f1112;
              --code-bg-raised: #17191b;
              --code-border: #303438;
              --code-text: #d8dcdf;
              --code-muted: #8e969d;
              --code-button-bg: #1b1e20;
              --code-button-hover: #24272a;
              --code-selection: #263653;
              --shadow-soft: 0 18px 44px rgb(0 0 0 / 16%);""",
              "dark code tokens",
          )

          replace_once(
              """  .code-frame { margin: 24px 0 30px; overflow: hidden; border: 1px solid var(--surface-dark-border); border-radius: var(--radius-md); background: var(--surface-dark); }
            .code-frame__bar { display: flex; height: 38px; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--surface-dark-border); background: var(--surface-dark-soft); padding: 0 11px 0 14px; }
            .code-frame__bar span { color: #8f969d; font-family: var(--font-mono); font-size: .68rem; }
            .code-frame pre { max-height: 560px; overflow: auto; padding: 18px; }
            .code-frame code { color: #d6dadf; font-size: .84rem; line-height: 1.75; white-space: pre; }
            .code-copy, .hash-button { border: 1px solid var(--border-strong); border-radius: 6px; background: transparent; padding: 5px 8px; cursor: pointer; color: var(--text-muted); font-size: .72rem; }
            .code-copy { border-color: #3a4046; color: #aab0b6; }
            .code-copy:hover, .hash-button:hover { border-color: var(--text-muted); color: var(--text-strong); }
            .code-copy:hover { color: #fff; }
            .code-copy.is-copied, .hash-button.is-copied { color: var(--success); }""",
              """  .code-frame {
              margin: 24px 0 30px;
              overflow: hidden;
              border: 1px solid var(--code-border);
              border-radius: var(--radius-md);
              background: var(--code-bg);
              box-shadow: inset 0 1px rgb(255 255 255 / 28%);
            }
            .code-frame__bar {
              display: flex;
              height: 38px;
              align-items: center;
              justify-content: space-between;
              border-bottom: 1px solid var(--code-border);
              background: var(--code-bg-raised);
              padding: 0 11px 0 14px;
            }
            .code-frame__bar span { color: var(--code-muted); font-family: var(--font-mono); font-size: .68rem; }
            .code-frame pre { max-height: 560px; margin: 0; overflow: auto; padding: 18px; scrollbar-color: var(--code-border) transparent; }
            .code-frame code { color: var(--code-text); font-size: .84rem; line-height: 1.75; white-space: pre; }
            .code-frame code::selection { background: var(--code-selection); }
            .code-copy, .hash-button { border: 1px solid var(--border-strong); border-radius: 6px; background: transparent; padding: 5px 8px; cursor: pointer; color: var(--text-muted); font-size: .72rem; }
            .code-copy { border-color: var(--code-border); background: var(--code-button-bg); color: var(--code-muted); }
            .hash-button:hover { border-color: var(--text-muted); color: var(--text-strong); }
            .code-copy:hover { border-color: color-mix(in srgb, var(--code-text) 35%, var(--code-border)); background: var(--code-button-hover); color: var(--code-text); }
            .code-copy.is-copied, .hash-button.is-copied { color: var(--success); }""",
              "code frame styles",
          )

          path.write_text(css)
          PY

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Sync latest release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_SYNC_REQUIRED: "true"
        run: npm run sync-release

      - name: Validate source and generated site
        run: npm run check

      - name: Verify both code themes are explicit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          css = Path("src/styles.css").read_text()
          required = [
              "--code-bg: #eeeeea;",
              "--code-bg: #0f1112;",
              "background: var(--code-bg);",
              "background: var(--code-bg-raised);",
              "color: var(--code-text);",
              "background: var(--code-button-bg);",
          ]
          missing = [item for item in required if item not in css]
          if missing:
              raise SystemExit(f"missing theme-aware code styles: {missing}")

          block = css[css.index("  .code-frame {"):css.index("  .callout {")]
          if "var(--surface-dark)" in block or "#fff" in block:
              raise SystemExit("code frame still contains a hard-coded dark-theme dependency")
          print("light and dark code block themes are explicit")
          PY

      - name: Commit the validated fix
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/patch-code-theme.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/styles.css .github/workflows/patch-code-theme.yml
          git commit -m "fix: match code blocks to the active color theme"
          git push origin "HEAD:${GITHUB_REF_NAME}"
