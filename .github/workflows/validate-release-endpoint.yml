name: Validate release metadata endpoint fix

on:
  push:
    branches:
      - fix/release-metadata-endpoint-20260828
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Sync latest release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_SYNC_REQUIRED: "true"
        run: npm run sync-release
      - name: Run complete site checks
        run: npm run check
