name: Export source for visual refinement

on:
  push:
    branches:
      - refine/premium-editorial-20260828
    paths:
      - ".github/workflows/export-source.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Archive repository source
        shell: bash
        run: |
          set -euo pipefail
          tar \
            --exclude=.git \
            --exclude=node_modules \
            --exclude=dist \
            --exclude=.cache \
            -czf /tmp/p2wlan-web-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: p2wlan-web-source
          path: /tmp/p2wlan-web-source.tar.gz
          if-no-files-found: error
          retention-days: 1
